<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"><title>Knowledge graph</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f8fa,#121b23);--panel:light-dark(#fff,#1b2935);--text:light-dark(#183044,#e4edf5);--muted:light-dark(#526777,#a5bacb);--line:light-dark(#cbd6df,#42586b);--accent:light-dark(#235e96,#a3c8ed)}*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}main{max-width:1200px;margin:auto}h1{font-size:26px}h2{font-size:20px}h3{font-size:15px}button,input,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--accent)}header p,.muted{color:var(--muted)}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.bar label{display:flex;flex-direction:column;gap:5px}.layout{display:grid;grid-template-columns:250px 1fr;gap:24px}.list{max-height:650px;overflow:auto}.list button{display:block;width:100%;margin:6px 0;text-align:left;overflow-wrap:anywhere}.list button[aria-pressed=true]{border:2px solid var(--accent)}.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}.network{width:100%;overflow:auto}.network svg{display:block;width:100%;min-width:500px}.network rect{fill:var(--bg);stroke:var(--line)}.network line{stroke:var(--line);stroke-width:2}.network text{fill:var(--text);font:13px system-ui}.pager{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.connections button{display:block;width:100%;text-align:left;margin:7px 0}.field{padding:10px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.field strong{display:block}.field small{color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 ui-monospace,monospace}.empty{color:var(--muted)}footer{color:var(--muted);margin-top:24px;font-size:13px}@media(max-width:700px){body{padding:14px}.layout{grid-template-columns:1fr}.list{max-height:180px}input{font-size:16px}}
</style></head><body><main><header><h1 id="title">Knowledge graph</h1><p>__AUDIENCE__ export · Offline explorer</p></header><div class="bar"><label>Find an entity<input id="search" type="search" placeholder="Search labels and types"></label><span id="count" aria-live="polite"></span></div><div class="layout"><nav id="list" class="list" aria-label="Graph entities"></nav><section id="detail" class="stage" aria-label="Selected entity"></section></div><footer>This file embeds only the selected export and makes no network requests. It is not encrypted: anyone with the file can read its contents. Classifications describe release eligibility, not independent verification of facts.</footer></main><script id="data" type="application/json">__GRAPH_DATA__</script><script>
(()=>{'use strict';const graph=JSON.parse(document.getElementById('data').textContent),byId=new Map(graph.nodes.map(n=>[n.id,n]));let selected=graph.nodes[0]?.id,page=0;const $=id=>document.getElementById(id);const el=(tag,text,cls)=>{const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x};const val=(r,k)=>r.fields[k]?.value;const title=graph.fields.title?.value;if(typeof title==='string')$('title').textContent=title;function pick(id){selected=id;page=0;render()}
function showFields(parent,fields){for(const [key,item]of Object.entries(fields)){const row=el('div',undefined,'field');row.append(el('strong',key.replaceAll('_',' ')),el('small',item.visibility));row.append(el(typeof item.value==='object'?'pre':'p',typeof item.value==='object'?JSON.stringify(item.value,null,2):String(item.value)));parent.append(row)}}
function render(){const query=$('search').value.toLowerCase(),list=$('list');list.replaceChildren();const matches=graph.nodes.filter(n=>(val(n,'label')+' '+val(n,'type')).toLowerCase().includes(query));for(const n of matches){const b=el('button',val(n,'label'));b.type='button';b.setAttribute('aria-pressed',String(n.id===selected));b.onclick=()=>pick(n.id);list.append(b)}if(!matches.length)list.append(el('p','No matching entities.','empty'));$('count').textContent=graph.nodes.length+' entities · '+graph.edges.length+' relationships';const detail=$('detail');detail.replaceChildren();const n=byId.get(selected);if(!n){detail.append(el('p','No entities in this export.','empty'));return}detail.append(el('h2',val(n,'label')),el('p',val(n,'type')+' · '+n.visibility,'muted'));const edges=graph.edges.filter(e=>e.source===selected||e.target===selected);const shown=edges.slice(page*8,page*8+8);const height=Math.max(130,shown.length*65+30);const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 650 '+height);svg.setAttribute('role','img');svg.setAttribute('aria-label','Selected entity and its connected neighbors');function element(tag,attrs,text){const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text)e.textContent=text;svg.append(e);return e}element('rect',{x:5,y:height/2-28,width:185,height:56,rx:8});element('text',{x:15,y:height/2+5},String(val(n,'label')).slice(0,23));shown.forEach((edge,i)=>{const target=byId.get(edge.source===selected?edge.target:edge.source),y=i*65+40;const forward=edge.source===selected;element('line',{x1:190,y1:height/2,x2:425,y2:y});element('rect',{x:425,y:y-24,width:215,height:48,rx:8});element('text',{x:435,y:y+5},String(val(target,'label')).slice(0,28));element('text',{x:207,y:y-8},(forward?'→ ':'← ')+String(val(edge,'relation')).slice(0,23))});
const network=el('div',undefined,'network');network.append(svg);detail.append(network);if(edges.length>8){const pager=el('div',undefined,'pager'),prev=el('button','Previous'),next=el('button','Next');prev.type=next.type='button';prev.disabled=page===0;next.disabled=(page+1)*8>=edges.length;prev.onclick=()=>{page--;render()};next.onclick=()=>{page++;render()};pager.append(prev,el('span','Connections '+(page*8+1)+'–'+Math.min((page+1)*8,edges.length)+' of '+edges.length),next);detail.append(pager)}const links=el('div',undefined,'connections');for(const edge of shown){const forward=edge.source===selected,target=byId.get(forward?edge.target:edge.source);const b=el('button',(forward?'→ ':'← ')+val(edge,'relation')+' · '+val(target,'label'));b.type='button';b.onclick=()=>pick(target.id);links.append(b);const info=el('details');info.append(el('summary','Relationship fields · '+edge.visibility));showFields(info,edge.fields);links.append(info)}detail.append(links,el('h3','Entity fields'));showFields(detail,n.fields);if(Object.keys(graph.fields).length){const info=el('details');info.append(el('summary','Graph fields'));showFields(info,graph.fields);detail.append(info)}}$('search').addEventListener('input',render);render()})();
</script></body></html>
