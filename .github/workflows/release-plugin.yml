name: Release plugin

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tag and configured version
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          configured = json.loads(Path("release/version.json").read_text())["version"]
          tagged = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if configured != tagged:
              raise SystemExit(f"tag {tagged} does not match configured {configured}")
          PY
      - name: Download previous update manifest when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern update.json --dir previous-release || true
      - name: Set release timestamp
        run: echo "PLUGIN_RELEASE_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build release package
        env:
          PLUGIN_SOURCE_COMMIT: ${{ github.sha }}
          PLUGIN_PREVIOUS_MANIFEST: previous-release/update.json
        run: |
          python scripts/build_plugin.py --sync --output dist/vladicaster-agent-skills
          python -m zipfile -c dist/vladicaster-agent-skills.zip dist/vladicaster-agent-skills
          python scripts/create_release_notes.py dist/vladicaster-agent-skills/release/update.json dist/release-notes.md
      - name: Validate repository and committed bundle
        run: |
          python scripts/validate_repository.py
          python scripts/build_plugin.py --check
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/vladicaster-agent-skills.zip \
            dist/vladicaster-agent-skills/release/update.json \
            --title "Vladicaster Agent Skills ${GITHUB_REF_NAME}" \
            --notes-file dist/release-notes.md
